{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate</title>

    <link rel="stylesheet" href="{% static 'css/bootstrap.css' %}?v=1">

    <style>
        .img{
            width: 90%;
            height: 560px;
            box-shadow: 0px 0px 4px grey;
        }
        .name{
            position: absolute;
            top: 38%;
          
        }
        .coursename{
            position: absolute;
            top: 49%;
           
            color: white;
        }
        .issuedate{
            position: absolute;
            top: 69%;
           left: 65%;
        }
        .ms-60{
            margin-left: 600px;
        }
    </style>
</head>
<body>
    <div class="">
        <img src="{% static 'images/certificate.png' %}" class="img ms-5 mt-4">
        <div class="name d-flex justify-content-center w-100">
            <h2 class=" text-dark">{{ so }}</h2>
        </div>
        <div class="coursename d-flex justify-content-center w-100">
            <h2 class="">{{ co.cname }}</h2>
        </div>
        <div class="issuedate d-flex  w-100">
            <p class="">{{ issuedate }}</p>
        </div>
    </div>
    <a href="{% url 'download_certificate' co.cid %}" class="btn btn-info mt-4 ms-60">Download Certificate</a>
</body>
</html>
