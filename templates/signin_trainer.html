{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in Trainer</title>

    <link rel="stylesheet" href="{% static 'css/bootstrap.css' %}">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    
    <style>
        .w-40{
            width: 20%;
        }
        #forgot-pw{
            background-color: aliceblue;
            position: fixed;
            height: 130px;
            left: 40%;
            top: 23%; 
        }
        
        .npw-div{
            position: absolute;
            top: 0%;
        }
        #close-btn{
            margin-left: 85%;
        }
        .navtohome{
            font-size: 50px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1 class="bg-dark text-white p-2">trainer login page</h1>

    <a href="{% url 'homepage' %}" class="text-decoration-none text-dark ms-5 navtohome"><i class="bi bi-arrow-left-circle"></i></a>

    <center>
        <form method="POST"  class="form-control w-25">
            {% csrf_token %}
            <div class="">
                <label for="te" class="mt-2 fs-5">Enter Email : </label>
                <input type="email" placeholder="Enter Email" name="te" id="te" class="form-control w-75 ">
            
                <p class="text-danger">{{ display.email }}</p>

                <label for="pw" class="mt-3 fs-5">Enter password : </label>
                <input type="password" placeholder="Enter Password" name="pw" id="pw" class="form-control w-75 mb-3">
            
                <p class="text-danger">{{ display.password }}</p>
                
                <a href="{% url 'send_otp' %}" class="text-decoration-none fs-5" id="forgot-pw-btn">forgot password..?</a>
            </div>
            <input type="submit" class="btn btn-dark mt-3">  
        </form>    
    </center>
            
    
</body>
</html>
