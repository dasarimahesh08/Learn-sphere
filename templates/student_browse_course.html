{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse course</title>

    <link rel="stylesheet" href="{% static 'css/bootstrap.css' %}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
    #browse-course{
        width: 98%;
        background-color: rgb(237, 238, 238);
        height: 99%;
        position: fixed;
        z-index: 1000;
    }
    .arrow{
        font-size: 50px;
    }
    .book-div{
        background-color: rgb(208, 242, 247);
        border-radius:55% ;
        height: 70px;     
    }
    .bi-book{
        font-size: 40px;
    }
    .ms-20{
        margin-left: 350px;
    }
    .padding{
        padding-left: 150px !important; 
    }
    </style>
</head>
<body>
    <div class="ms-3 mt-3" id="browse-course">
        <!-- header part starting -->
        <div class="d-flex">
            <div class="fs-1 ms-5 mt-4">
                <a href="{% url 'student_dashboard' %}" class="text-dark arrow">
                    <i class="bi bi-arrow-left-circle "></i>
                </a>
            </div>
            <div class="ms-4 mt-4 ps-3 pe-3 pt-1 book-div">
                <i class="bi bi-book"></i>
            </div>
            <div class="ms-3 mt-4">
                <h3 class="">Browse Courses</h3>
                <p class="">Explore available courses and continue learning.</p>
            </div>
        </div>
        <hr>
        <!-- header part ending -->
        <!-- main content starts -->
         <div class="mt-3">
            <table class="table w-auto fs-5 ms-20">
                <tr class="">
                    <th class="ps-5">course name</th>
                    <th class="ps-5 padding text-center">price</th>
                    <td></td>
                </tr>
                {% for c in lco %}
                    <tr class="">
                        <td class="ps-5 ">{{ c.cname }}</td>
                        <td class="padding"><i class="bi bi-currency-rupee"></i>{{ c.price}}</td>
                        <td class="padding pe-5">
                            <a href="{% url 'course_detail' c.cid %}" class="text-decoration-none">
                                view course <i class="bi bi-chevron-right"></i>
                            </a>
                        </td>
                    </tr>
                {% endfor %}
            </table>
         </div>
        <!-- main content ends -->
    </div>
</body>
</html>
