{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Courses</title>

    <link rel="stylesheet" href="{% static 'css/bootstrap.css' %}?v=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .body-block{
            background-color: rgb(247, 250, 253);
        }
        .imges{
            height: 150px;
        }
    </style>
</head>
<body>
   <div class="body-block pt-4">
        <div class="d-flex ms-5">
            <a href="{% url 'student_dashboard' %}" class="text-dark">
                <i class="bi bi-arrow-left-circle fs-1"></i>
            </a>
            <div class="">
                <h2 class="ms-4">My Courses</h2>
                <p class="ms-4">Browse and access all courses you are enrolled in.</p>
            </div>
        </div>
        <div class="container-fluid mt-4">
            <div class="row ms-5">
                {% for c in scl %}
                <div class="col-3 mb-5">
                    <div class="card" style="width: 18rem;">
                        <img src="{{ c.cimage.url }}" class="card-img-top imges" alt="...">
                        <div class="card-body">
                            <h5 class="card-title">{{ c.cname }}</h5>
                            <p class="card-text">{{ c.description }}</p>
                            <a href="{% url 'my_course_content' c.cid %}" class="btn btn-outline-primary ms-3">
                                View Content<i class="bi bi-arrow-right ms-2"></i>
                            </a>
                        </div>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
   </div>
</body>
</html>
