{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.css' %}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>

    <style>
        .edit-profile-parent{
            background-color: rgb(250, 249, 247);
            width: 98%;
            height: 100%;
            position: fixed;
            top: 20px;
            z-index: 1000;
        }
        .inner-parent{
            width: 95%;
        }
        #edit-close{
            border: 1px solid black;
            
        }
        .person-symbol{
            font-size: 70px;
        }
        .w-40{
            width: 40%;
        }
        .w-90{
            width: 90%;
        }
        .main-block{
            background-color: rgb(245, 243, 241);
            box-shadow: 0px 0px 4px grey;
            position: fixed;
            top: 0px;
            width: 97%;
            height:750px;
        }
        .crop-div{
            height: 600px;
            width: 500px;
            background-color: rgb(243, 244, 245);
        }
        .crop-box{
            width: 400px;
            height: 500px;
            margin: auto;
            background-color: rgb(240, 239, 239);
            border-radius: 10px;
        }
        #image{
            width: 100%;
        }
        .cropper-view-box,
        .cropper-face{
            border-radius: 50%;
        }
        .ms-10{
            margin-left: 150px;
        }
        .preview-block{
            width: 500px;
            height: 600px;
        }
        #previewImg{
            width: 250px;
            height: 250px;
            border-radius: 50%;
            box-shadow: 0px 0px 9px grey;
            margin-left:130px;
            margin-top: 10px;
        }
        .img-text{
            margin-left: 205px;
            color: rgb(70, 69, 69);
        }
        #saveImg{
            margin-left: 190px;
        }
    
    </style>
    
</head>
<body>
    <div class="edit-profile-parent rounded-2 ms-3" id="edit-profile-popup">
        <div class="inner-parent ms-4">
            <!-- header part -->
            <div class="d-flex ms-4 mt-4">
                <div class="mt-3">
                    <a href="{% url 'student_dashboard' %}" class="text-dark rounded-3 fs-1" id="edit-close">
                        <i class="bi bi-arrow-left ms-3 me-3 mt-3"></i>
                    </a>
                </div>
                <div class="d-flex">
                    <div class="person-symbol text-primary ms-3">
                        <i class="bi bi-person-circle"></i>
                    </div>
                    <div class="mt-3 ms-3">
                        <h2 class="">Edit Profile</h2>
                        <p class="">Update your profile</p>
                    </div>
                </div>
            </div>
            <!-- header ends -->
            <hr>
            <!-- update code starts here -->
            <div class="">
                <form method="POST" id="form" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="border rounded-3">
                        <div class="d-flex gap-5 w-90 ms-5 me-5">
                            <div class="w-50 ms-5 me-5">
                                <label for="sfn" class="fs-5 ms-4">Full Name</label>
                                <input type="text" name="sfn" id="sfn" placeholder="Enter full name" class="form-control ps-4">
                                <p class="text-danger" id="sfn-error"></p>
                            </div>
                            <div class="w-50 ms-5 me-5">
                                <label for="un" class="fs-5 ms-4">User name</label>
                                <input type="text" name="un" id="un" placeholder="Enter user name" class="form-control ps-4">
                                <p class="text-danger" id="un-error"></p>
                            </div>
                        </div>

                        <div class="d-flex gap-5 w-90 ms-5 me-5 mt-4">
                            <div class="w-50 ms-5 me-5">
                                <label for="se" class="fs-5 ms-4">Email ID</label>
                                <input type="email" name="se" id="se" placeholder="Enter Email ID" class="form-control ps-4">
                                <p class="text-danger" id="se-error"></p>
                            </div>
                            <div class="w-50 ms-5 me-5">
                                <label for="phno" class="fs-5 ms-4">Phone Number</label>
                                <input type="text" name="phno" id="phno" placeholder="Enter phone number" class="form-control ps-4">
                                <p class="text-danger" id="phno-error"></p>
                            </div>
                        </div>

                        <div class="d-flex gap-5 w-90 ms-5 me-5 mt-4">
                            <div class="w-50 ms-5 me-5">
                                <label for="add" class="fs-5 ms-4">Address</label>
                                <input type="text" name="add" id="add" placeholder="Enter Adress" class="form-control ps-4">
                                <p class="text-danger" id="add-error"></p>
                            </div>

                            <div class="w-50 ms-5 me-5">
                                <label for="profile" class="fs-5 ms-3">Profile pic
                                    <span class="text-danger ms-4 fs-3">*</span>
                                </label>
                                <input type="file" name="profile" id="profile" class="form-control ">
                            </div>

                        </div>
                        <!-- profile cropper popup comes here -->
                        <div class="d-flex gap-5 main-block d-none rounded-2 mt-2 pb-4" id="profile-popup">
                        <div class="crop-div border rounded-2 mt-5 ms-5 pt-3">
                            <div class="crop-box ">
                                <img id="image" class="border">
                                <button type="button" id="cropBtn" class="btn btn-success fs-5 mt-3 ms-10">
                                    <i class="bi bi-check2"></i>
                                </button>
                            </div>
                        </div>

                        <div class="preview-block border rounded-2 ms-10 mt-5">
                            <h3 class="ms-4 mt-4">Preview</h3>
                            <p class="ms-4">This is how your profile picture will appear</p>
                            <div class="" id="preview">
                                <img src="" alt="" id="previewImg">
                                <h4 class="img-text mt-3">Preview</h4>
                                <button type="button" class="btn btn-primary mt-1 fs-5" id="saveImg">Save Image</button>
                            </div>
                        </div>
                    </div>

                        <div class="d-flex gap-5 w-90 ms-5 me-5 mt-4">
                            <div class="w-50 ms-5 me-5">
                                <label for="age" class="fs-5 ms-4">Age</label>
                                <input type="number" name="age" id="age" placeholder="Enter Age" class="form-control ps-4">
                                <p class="text-danger" id="age-error"></p>
                            </div>
                            <div class="w-50 ms-5 me-5">
                                <label for="dob" class="fs-5 ms-4">Date of Birth</label>
                                <input type="date" name="dob" id="dob"  class="form-control ps-4">
                                <p class="text-danger" id="dob-error"></p>
                            </div>
                        </div>
                        <div class="ms-5 d-flex mb-4">
                            <button class="btn btn-primary ms-5 mt-5" id="update-btn">
                                <i class="bi bi-floppy me-2"></i>Update Profile
                            </button>

                            <button class="cancel-btn fs-5 border rounded-2 ms-5 mt-5 ps-2 pe-2">
                                <a href="{% url 'student_dashboard' %}" class="text-decoration-none text-dark">Cancel</a>
                            </button>
                            <p class="text-success fs-5">{{ errorshow.success }}</p>
                            <p class="text-danger fs-5">{{ errorshow.fail }}</p>
                        </div>
                    </div> 
                </form>
            </div>
            <!-- update code ends herefd -->
        </div>
    </div>

    <script src="{% static 'js/student_edit_profile.js' %}"></script>
</body>
</html>
