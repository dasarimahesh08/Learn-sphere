{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View video</title>

    <link rel="stylesheet" href="{% static 'css/bootstrap.css' %}?v=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .main-block{
            background-color: aliceblue;

        }
        .videoBlock{
            width: 70%;
        }
        .detailsBlock{
            width: 30%;
        }
        .h-45{
            height: 500px;
            box-shadow: 0px 0px 3px grey;
        }
        .video-display{
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div class="main-block pt-4">
        <div class="d-flex ms-5">
            <a href="{% url 'display_course_content' %}" class="text-dark border rounded-5 ps-3 mb-2 pe-2">
                <i class="bi bi-arrow-left fs-1"></i>
            </a>
            <div class="ms-4">
                <h3 class="">View video</h3>
                <h5 class="">course : {{ cvo.course }}</h5>
            </div>
        </div>
        <div class="d-flex ms-4 me-4 mt-5">
            <div class="videoBlock h-45 border rounded-2 me-5">
                {% if cvo.video %}
                    <iframe src="{{ cvo.video_url }}" allow="autoplay" class="w-100 h-100" frameborder="0"></iframe>
                {% endif %}
            </div>
            <div class="detailsBlock h-45 border pb-3 rounded-2">

                <div class="ms-3 mt-3">
                    <h3 class="">Video details</h3>

                    <div class="mt-4 mb-4 d-flex">
                        <i class="bi bi-film fs-2"></i>
                        <div class="ms-2">
                            <h5 class="">Title</h5>
                            <p class="">{{ cvo.title }}</p>
                        </div>
                    </div>

                    <div class="mt-3 mb-4 d-flex">
                        <i class="bi bi-mortarboard-fill fs-1"></i>
                        <div class="ms-3">
                            <h5 class="">Course</h5>
                            <p class="">{{ cvo.course }}</p>
                        </div>
                    </div>

                    <div class="mt-3 mb-4 d-flex">
                        <i class="bi bi-calendar-fill fs-2"></i>
                        <div class="ms-3">
                            <h5 class="">Uploaded on </h5>
                            <p class="">{{ cvo.upload_date }}</p>
                        </div>
                    </div>

                    <div class="mt-3 d-flex">
                        <i class="bi bi-person fs-1"></i>
                        <div class="ms-3">
                            <h5 class="">Uploaded by</h5>
                            <p class="">{{ cvo.uploaded_by }}</p>
                        </div>
                    </div>
                    
                </div>
                
            </div>

        </div>
        <a href="{% url 'display_course_content' %}" class=" btn btn-primary fs-5 mt-5 ms-5">
            <i class="bi bi-arrow-left me-2"></i>Back to Content
        </a>
    </div>
</body>
</html>
